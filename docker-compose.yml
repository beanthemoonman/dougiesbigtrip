# Phase 17 — one-command deploy of the Counter Douglas stack.
#
#   docker compose --env-file .env up --build
#
# Then open http://localhost:8080 (or https://localhost:8443 with a
# self-signed cert warning). The browser connects to the server through
# the nginx proxy — no separate :9876 port needed.
#
#   WS path:    ws://localhost:8080/ws   (or wss://localhost:8443/ws)
#
# Requires a .env file (copy .env.example and fill in values).

services:
  db:
    image: postgres:16
    # ponytail: shared_buffers/max_connections dialled down to match — the
    # stock 128MB + 100 conns is sized for a real workload, not one Keycloak
    # and one game server.
    mem_limit: 192m
    shm_size: 64m
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=50"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the `keycloak` schema. First boot only — see auth/init-schema.sql.
      - ./auth/init-schema.sql:/docker-entrypoint-initdb.d/10-keycloak-schema.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 3s

  auth:
    # Pre-built image (see Dockerfile.auth) so this runs `start --optimized`.
    build:
      context: .
      dockerfile: Dockerfile.auth
    # ponytail: a handful of players — Keycloak's default heap is 70% of host
    # RAM, which is absurd here. 256M heap; the 512M container ceiling is heap
    # plus the JVM's non-heap overhead (metaspace, code cache, direct buffers,
    # Infinispan/JGroups), which runs ~150M — measured at ~380M RSS with a 320M
    # heap, hence the gap. Raise both together if `docker stats` shows an
    # OOMKill or steady-state usage near the limit.
    mem_limit: 512m
    environment:
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx256m"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-dougys}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_SCHEMA: keycloak
      KC_HEALTH_ENABLED: "true"
      # Full public URL: nginx sends Host without the port, so a bare hostname
      # would build redirect/issuer URLs missing :8082 and break the OAuth
      # round-trip. Override in .env for a real deployment (the public URL of
      # the reverse proxy, e.g. https://counterdouggo.yikersis.land/auth).
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:8082/auth}
      # Keycloak serves at / by default; the proxy and all the advertised
      # redirect URIs use /auth.
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    command:
      - start
      - --optimized
      - --import-realm
      - --http-port=8080
    expose:
      - "8080"
    volumes:
      - ./auth/counter-douglas-realm.json:/opt/keycloak/data/import/counter-douglas-realm.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s

  keycloak-init:
    # One-shot — patches the Google IDP clientId / clientSecret via the
    # Keycloak Admin API because `--import-realm` does not resolve
    # ${env.GOOGLE_CLIENT_ID} placeholders nested in identity-provider config.
    image: alpine:latest
    command: >
      sh -c "apk add --no-cache curl jq && /init-keycloak-idp.sh"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    volumes:
      - ./scripts/init-keycloak-idp.sh:/init-keycloak-idp.sh:ro
    depends_on:
      auth:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Admin API must be reachable from the nginx container, so it binds all
      # interfaces (compose-internal only — `expose`, not `ports`). Bound
      # off-loopback, the admin gate requires a real admin JWT.
      API_BIND: 0.0.0.0:9877
      # Passed through from .env (previously never reached the container, so the
      # documented AUTH_REQUIRED=true gate was silently off). Unset ⇒ auth off
      # ⇒ the admin API refuses every write rather than running open.
      AUTH_REQUIRED: ${AUTH_REQUIRED:-}
      # The server derives the expected JWT issuer from this. It must match the
      # URL the *browser* got its token from, or every join is refused with
      # InvalidIssuer (and the client sits on a dead connection). Same default
      # as the auth service above — keep the two in step.
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:8082/auth}
    expose:
      - "9876"
      - "9877"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      # Single published port. Dev hits http://localhost:8082 directly;
      # deployment terminates TLS in a reverse proxy in front of this.
      # Must appear in the realm's redirectUris / KC_HOSTNAME or Keycloak
      # rejects the login with "Invalid parameter: redirect_uri".
      - "8082:80"
    depends_on:
      server:
        condition: service_started
      auth:
        condition: service_healthy
    restart: unless-stopped
    # Prod: mount real certs over the baked-in self-signed pair.
    # volumes:
    #   - ./certs:/etc/nginx/certs:ro

volumes:
  pgdata:
