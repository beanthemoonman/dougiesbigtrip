name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: cargo install wasm-pack

      - run: wasm-pack build sim --target bundler --features wasm

      - run: pnpm install

      - run: pnpm lint

      - run: pnpm typecheck

      # pnpm forwards trailing flags to vitest. Console output keeps the default reporter; JUnit XML is the artifact.
      - run: pnpm test --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn

      - run: pnpm build
